<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>FOODTAP - My Orders</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        color: #fff;
        background: #090909;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 15% 15%, rgba(255,112,67,.16), transparent 28%),
            radial-gradient(circle at 85% 25%, rgba(255,87,34,.11), transparent 30%),
            radial-gradient(circle at 50% 90%, rgba(255,112,67,.08), transparent 32%),
            #090909;
        z-index: -2;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background:
            linear-gradient(
                120deg,
                rgba(255,255,255,.015),
                transparent 30%,
                rgba(255,112,67,.018),
                transparent 70%
            );
        z-index: -1;
        pointer-events: none;
    }

    .navbar {
        width: 100%;
        padding: 22px 7%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,.08);
        background: rgba(9,9,9,.72);
        backdrop-filter: blur(12px);
    }

    .logo {
        font-size: 28px;
        font-weight: 800;
        color: #ff7043;
        letter-spacing: 1px;
    }

    .nav-buttons {
        display: flex;
        gap: 12px;
    }

    .nav-btn {
        padding: 10px 18px;
        border: 1px solid rgba(255,112,67,.4);
        border-radius: 10px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        transition: .3s;
    }

    .nav-btn:hover {
        background: #ff7043;
        border-color: #ff7043;
    }

    .container {
        width: 90%;
        max-width: 1000px;
        margin: 45px auto;
    }

    .page-header {
        margin-bottom: 28px;
    }

    .page-header h1 {
        font-size: 34px;
        margin-bottom: 8px;
    }

    .page-header p {
        color: #aaa;
        font-size: 15px;
    }

    .orders-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .order-card {
        background: rgba(20,20,20,.9);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 18px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .order-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 20px;
    }

    .order-id {
        font-size: 18px;
        font-weight: 700;
    }

    .order-date {
        color: #999;
        font-size: 13px;
        margin-top: 6px;
    }

    .status {
        padding: 8px 14px;
        border-radius: 20px;
        background: rgba(255,112,67,.14);
        border: 1px solid rgba(255,112,67,.35);
        color: #ff8a65;
        font-size: 13px;
        font-weight: 700;
    }

    .order-items {
        border-top: 1px solid rgba(255,255,255,.08);
        border-bottom: 1px solid rgba(255,255,255,.08);
        padding: 16px 0;
        margin-bottom: 18px;
    }

    .order-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 0;
        color: #ddd;
        font-size: 14px;
    }

    .item-name {
        max-width: 70%;
    }

    .item-price {
        color: #fff;
        font-weight: 600;
    }

    .order-info {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 20px;
    }

    .info-box {
        background: rgba(255,255,255,.035);
        border-radius: 12px;
        padding: 14px;
    }

    .info-label {
        color: #888;
        font-size: 12px;
        margin-bottom: 6px;
    }

    .info-value {
        color: #fff;
        font-size: 15px;
        font-weight: 600;
    }

    .order-bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
    }

    .total-label {
        color: #aaa;
        font-size: 13px;
    }

    .total-price {
        color: #ff7043;
        font-size: 23px;
        font-weight: 800;
        margin-top: 4px;
    }

    .track-btn {
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        background: #ff7043;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: .3s;
    }

    .track-btn:hover {
        background: #ff5722;
        transform: translateY(-2px);
    }

    .empty-state {
        text-align: center;
        padding: 70px 20px;
        background: rgba(20,20,20,.9);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 18px;
    }

    .empty-state h2 {
        font-size: 25px;
        margin-bottom: 10px;
    }

    .empty-state p {
        color: #999;
        margin-bottom: 25px;
    }

    .browse-btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        background: #ff7043;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
    }

    @media (max-width:700px) {
        .navbar {
            padding: 18px 5%;
        }

        .logo {
            font-size: 23px;
        }

        .container {
            width: 92%;
            margin: 30px auto;
        }

        .page-header h1 {
            font-size: 28px;
        }

        .order-top {
            align-items: flex-start;
            flex-direction: column;
        }

        .order-info {
            grid-template-columns: 1fr;
        }

        .order-bottom {
            flex-direction: column;
            align-items: stretch;
        }

        .track-btn {
            width: 100%;
        }
    }
</style>
</head> <body>
<nav class="navbar">

    <div class="logo">
        FOODTAP
    </div>

    <div class="nav-buttons">

        <button
            class="nav-btn"
            onclick="goRestaurants()"
        >
            Restaurants
        </button>

        <button
            class="nav-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</nav>

<main class="container">

    <div class="page-header">

        <h1>
            My Orders
        </h1>

        <p>
            View your recent FOODTAP orders and track their status.
        </p>

    </div>

    <div
        id="ordersContainer"
        class="orders-container"
    ></div>

</main>

<script>

    const currentUser = JSON.parse(
        localStorage.getItem("foodtapCurrentUser") || "null"
    );

    if (!currentUser) {
        window.location.href = "login.html";
    }

    function formatDate(dateString) {

        if (!dateString) {
            return "Date unavailable";
        }

        const date = new Date(dateString);

        if (isNaN(date.getTime())) {
            return "Date unavailable";
        }

        return date.toLocaleString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function getPaymentName(payment) {

        if (payment === "COD") {
            return "Cash on Delivery";
        }

        if (payment === "UPI") {
            return "UPI";
        }

        if (payment === "CARD") {
            return "Debit/Credit Card";
        }

        return payment || "Not available";
    }

    function loadOrders() {

        try {

            let orders = JSON.parse(
                localStorage.getItem("foodtapOrders") || "[]"
            );

            const currentOrder = JSON.parse(
                localStorage.getItem("foodtapCurrentOrder") || "null"
            );

            const trackingOrderId =
                localStorage.getItem("foodtapTrackingOrderId");

            /*
             * Add the current order if it is available.
             */
            if (
                currentOrder &&
                currentOrder.orderId
            ) {

                const exists = orders.some(function(order) {
                    return order.orderId === currentOrder.orderId;
                });

                if (!exists) {
                    orders.push(currentOrder);
                }
            }

            /*
             * Find the order being tracked.
             */
            if (
                trackingOrderId &&
                Array.isArray(orders)
            ) {

                const trackedOrder = orders.find(function(order) {
                    return order.orderId === trackingOrderId;
                });

                if (
                    trackedOrder &&
                    currentOrder &&
                    trackedOrder.orderId === currentOrder.orderId
                ) {
                    orders = orders.filter(function(order) {
                        return order.orderId !== trackedOrder.orderId;
                    });

                    orders.push(trackedOrder);
                }
            }

            /*
             * Select orders belonging to the current user.
             */
            let userOrders = orders.filter(function(order) {

                return (
                    order.userId === currentUser.email ||
                    order.userId === currentUser.name ||
                    order.customerName === currentUser.name ||
                    order.customerName === currentUser.email
                );
            });

            /*
             * If the current order exists but user information
             * does not match, still display that current order.
             */
            if (
                userOrders.length === 0 &&
                currentOrder &&
                currentOrder.orderId
            ) {

                userOrders = [currentOrder];
            }

            /*
             * If the tracking order exists, display it.
             */
            if (
                userOrders.length === 0 &&
                trackingOrderId
            ) {

                const trackedOrder = orders.find(function(order) {
                    return order.orderId === trackingOrderId;
                });

                if (trackedOrder) {
                    userOrders = [trackedOrder];
                }
            }

            const container = document.getElementById(
                "ordersContainer"
            );

            if (userOrders.length === 0) {

                container.innerHTML = `
                    <div class="empty-state">

                        <h2>
                            No Orders Yet
                        </h2>

                        <p>
                            Your placed orders will appear here.
                        </p>

                        <button
                            class="browse-btn"
                            onclick="goRestaurants()"
                        >
                            Browse Restaurants
                        </button>

                    </div>
                `;

                return;
            }

            userOrders.sort(function(a, b) {

                return new Date(b.orderDate) -
                    new Date(a.orderDate);

            });

            container.innerHTML = userOrders.map(function(order) {

                const items = Array.isArray(order.items)
                    ? order.items
                    : [];

                const itemsHTML = items.length > 0
                    ? items.map(function(item) {

                        return `
                            <div class="order-item">

                                <span class="item-name">
                                    ${item.name} × ${item.quantity || 1}
                                </span>

                                <span class="item-price">
                                    ₹${(
                                        Number(item.price || 0) *
                                        Number(item.quantity || 1)
                                    ).toFixed(2)}
                                </span>

                            </div>
                        `;

                    }).join("")

                    : `
                        <div class="order-item">

                            <span class="item-name">
                                Order items unavailable
                            </span>

                        </div>
                    `;

                return `
                    <div class="order-card">

                        <div class="order-top">

                            <div>

                                <div class="order-id">
                                    Order #${order.orderId}
                                </div>

                                <div class="order-date">
                                    ${formatDate(order.orderDate)}
                                </div>

                            </div>

                            <div class="status">
                                ${order.status || "PLACED"}
                            </div>

                        </div>

                        <div class="order-items">
                            ${itemsHTML}
                        </div>

                        <div class="order-info">

                            <div class="info-box">

                                <div class="info-label">
                                    Payment
                                </div>

                                <div class="info-value">
                                    ${getPaymentName(order.paymentOption)}
                                </div>

                            </div>

                            <div class="info-box">

                                <div class="info-label">
                                    Items
                                </div>

                                <div class="info-value">
                                    ${items.reduce(
                                        function(total, item) {
                                            return total +
                                                Number(item.quantity || 1);
                                        },
                                        0
                                    )}
                                </div>

                            </div>

                            <div class="info-box">

                                <div class="info-label">
                                    Delivery
                                </div>

                                <div class="info-value">
                                    ${
                                        order.deliveryDetails &&
                                        order.deliveryDetails.city
                                            ? order.deliveryDetails.city
                                            : "Address saved"
                                    }
                                </div>

                            </div>

                        </div>

                        <div class="order-bottom">

                            <div>

                                <div class="total-label">
                                    Total Amount
                                </div>

                                <div class="total-price">
                                    ₹${Number(order.total || 0).toFixed(2)}
                                </div>

                            </div>

                            <button
                                class="track-btn"
                                onclick="trackOrder('${order.orderId}')"
                            >
                                Track Order
                            </button>

                        </div>

                    </div>
                `;

            }).join("");

        } catch (error) {

            console.error(
                "FOODTAP Orders Error:",
                error
            );

            document.getElementById(
                "ordersContainer"
            ).innerHTML = `
                <div class="empty-state">

                    <h2>
                        Unable to Load Orders
                    </h2>

                    <p>
                        Please refresh the page and try again.
                    </p>

                    <button
                        class="browse-btn"
                        onclick="location.reload()"
                    >
                        Refresh
                    </button>

                </div>
            `;
        }
    }

    function trackOrder(orderId) {

        localStorage.setItem(
            "foodtapTrackingOrderId",
            orderId
        );

        localStorage.setItem(
            "foodtapCurrentOrderId",
            orderId
        );

        window.location.href = "track-order.html";
    }

    function goRestaurants() {
        window.location.href = "restaurants.html";
    }

    function logout() {

        localStorage.removeItem(
            "foodtapCurrentUser"
        );

        localStorage.removeItem(
            "foodtapSelectedRestaurant"
        );

        localStorage.removeItem(
            "foodtapSelectedFood"
        );

        window.location.href = "login.html";
    }

    loadOrders();

</script>
</body> </html>
