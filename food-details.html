<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>FOODTAP - Food Details</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        color: #fff;
        background: #090909;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -3;
        background:
            radial-gradient(circle at 15% 15%, rgba(255, 112, 67, .16), transparent 28%),
            radial-gradient(circle at 85% 25%, rgba(255, 87, 34, .11), transparent 30%),
            radial-gradient(circle at 50% 90%, rgba(255, 112, 67, .08), transparent 32%),
            #090909;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
            linear-gradient(
                120deg,
                rgba(255, 255, 255, .015),
                transparent 30%,
                rgba(255, 112, 67, .018),
                transparent 70%
            );
        pointer-events: none;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 100;
        width: 100%;
        padding: 17px 5%;
        background: rgba(10, 10, 10, .84);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .navbar {
        max-width: 1400px;
        margin: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 25px;
    }

    .logo {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1.5px;
        color: #ff7043;
        text-shadow: 0 0 20px rgba(255, 112, 67, .22);
    }

    .logo span {
        color: #fff;
    }

    .cart-btn {
        border: none;
        padding: 12px 20px;
        border-radius: 13px;
        background: #ff7043;
        color: #111;
        font-weight: 800;
        cursor: pointer;
        transition: .3s;
    }

    .cart-btn:hover {
        background: #ff855f;
        transform: translateY(-1px);
    }

    .container {
        width: 90%;
        max-width: 1200px;
        margin: auto;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 30px;
        padding: 11px 17px;
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 13px;
        background: rgba(255, 255, 255, .035);
        color: #ddd;
        cursor: pointer;
        transition: .3s;
    }

    .back-btn:hover {
        border-color: #ff7043;
        color: #ff7043;
    }

    .food-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 45px;
        align-items: center;
        margin: 45px 0 70px;
    }

    .food-image {
        height: 500px;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, .08);
        background: #181818;
        box-shadow: 0 25px 70px rgba(0, 0, 0, .45);
    }

    .food-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .food-info {
        padding: 15px 0;
    }

    .category {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 25px;
        background: rgba(255, 112, 67, .1);
        border: 1px solid rgba(255, 112, 67, .3);
        color: #ff906f;
        font-size: 13px;
        margin-bottom: 18px;
    }

    .food-info h1 {
        font-size: clamp(36px, 5vw, 55px);
        line-height: 1.08;
        margin-bottom: 18px;
    }

    .description {
        color: #bdbdbd;
        line-height: 1.7;
        font-size: 15px;
        max-width: 580px;
        margin-bottom: 25px;
    }

    .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    .meta-item {
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, .045);
        border: 1px solid rgba(255, 255, 255, .08);
        color: #ddd;
        font-size: 13px;
    }

    .price {
        font-size: 30px;
        font-weight: 900;
        color: #ff7043;
        margin-bottom: 25px;
    }

    .quantity-section {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
    }

    .quantity-section span {
        color: #aaa;
        font-size: 14px;
    }

    .quantity {
        display: flex;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 13px;
        overflow: hidden;
        background: #151515;
    }

    .quantity button {
        width: 42px;
        height: 42px;
        border: none;
        background: #222;
        color: #fff;
        cursor: pointer;
        font-size: 20px;
        transition: .3s;
    }

    .quantity button:hover {
        background: #ff7043;
        color: #111;
    }

    .quantity-value {
        width: 45px;
        text-align: center;
        font-weight: 700;
    }

    .add-cart {
        width: 100%;
        max-width: 400px;
        padding: 15px 22px;
        border: none;
        border-radius: 14px;
        background: #ff7043;
        color: #111;
        font-weight: 900;
        font-size: 15px;
        cursor: pointer;
        transition: .3s;
    }

    .add-cart:hover {
        background: #ff855f;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(255, 112, 67, .2);
    }

    .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 30px);
        background: #171717;
        border: 1px solid rgba(255, 112, 67, .35);
        color: #fff;
        padding: 14px 21px;
        border-radius: 13px;
        opacity: 0;
        pointer-events: none;
        transition: .35s;
        z-index: 500;
        box-shadow: 0 15px 35px rgba(0, 0, 0, .4);
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    footer {
        margin-top: 30px;
        padding: 35px 5%;
        border-top: 1px solid rgba(255, 255, 255, .07);
        text-align: center;
        color: #777;
        font-size: 13px;
    }

    footer strong {
        color: #ff7043;
    }

    @media (max-width: 800px) {
        .food-details {
            grid-template-columns: 1fr;
            gap: 30px;
        }

        .food-image {
            height: 380px;
        }

        .food-info h1 {
            font-size: 40px;
        }
    }

    @media (max-width: 500px) {
        header {
            padding: 14px 5%;
        }

        .logo {
            font-size: 23px;
        }

        .cart-btn {
            padding: 10px 14px;
            font-size: 12px;
        }

        .food-image {
            height: 300px;
            border-radius: 22px;
        }

        .food-info h1 {
            font-size: 34px;
        }
    }
</style>
</head> <body>
<header>
    <div class="navbar">

        <div class="logo">
            FOOD<span>TAP</span>
        </div>

        <button
            class="cart-btn"
            onclick="openCart()">
            Cart <span id="cartCount">0</span>
        </button>

    </div>
</header>

<main class="container">

    <button
        class="back-btn"
        onclick="goBack()">
        ← Back to Menu
    </button>

    <section class="food-details">

        <div class="food-image">

            <img
                id="foodImage"
                src=""
                alt="Food">

        </div>

        <div class="food-info">

            <div
                class="category"
                id="foodCategory">
                Food
            </div>

            <h1 id="foodName">
                Food Name
            </h1>

            <p
                class="description"
                id="foodDescription">
                Delicious food prepared with fresh ingredients.
            </p>

            <div class="meta">

                <div
                    class="meta-item"
                    id="foodType">
                    Veg
                </div>

                <div
                    class="meta-item"
                    id="foodRating">
                    Rating 4.5
                </div>

                <div
                    class="meta-item"
                    id="foodTime">
                    20 min
                </div>

            </div>

            <div
                class="price"
                id="foodPrice">
                ₹120
            </div>

            <div class="quantity-section">

                <span>
                    Quantity
                </span>

                <div class="quantity">

                    <button
                        onclick="changeQuantity(-1)">
                        −
                    </button>

                    <div
                        class="quantity-value"
                        id="quantityValue">
                        1
                    </div>

                    <button
                        onclick="changeQuantity(1)">
                        +
                    </button>

                </div>

            </div>

            <button
                class="add-cart"
                onclick="addToCart()">
                Add to Cart
            </button>

        </div>

    </section>

</main>

<footer>
    <strong>FOODTAP</strong>
    |
    Delicious food, delivered with care.
</footer>

<div
    class="toast"
    id="toast">
</div>

<script>

    const currentUser = JSON.parse(
        localStorage.getItem("foodtapCurrentUser") || "null"
    );

    if (!currentUser) {
        window.location.href = "login.html";
    }

    const foods = [

        {
            id: 1801,
            restaurant: 18,
            name: "Margherita Pizza",
            category: "Pizza",
            type: "veg",
            price: 199,
            rating: 4.6,
            time: "25 min",
            description: "Classic pizza topped with rich tomato sauce, mozzarella cheese and fresh herbs.",
            image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1000&q=90"
        },

        {
            id: 1802,
            restaurant: 18,
            name: "Farmhouse Pizza",
            category: "Pizza",
            type: "veg",
            price: 249,
            rating: 4.7,
            time: "25 min",
            description: "Loaded pizza with onion, capsicum, tomato, mushroom and melted mozzarella cheese.",
            image: "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=1000&q=90"
        },

        {
            id: 1803,
            restaurant: 18,
            name: "Paneer Tikka Pizza",
            category: "Pizza",
            type: "veg",
            price: 279,
            rating: 4.8,
            time: "30 min",
            description: "Delicious pizza topped with spicy paneer tikka, onion, capsicum and extra cheese.",
            image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=90"
        },

        {
            id: 1804,
            restaurant: 18,
            name: "Chicken Tikka Pizza",
            category: "Pizza",
            type: "nonveg",
            price: 299,
            rating: 4.8,
            time: "30 min",
            description: "Cheesy pizza topped with juicy chicken tikka, onion, capsicum and signature seasoning.",
            image: "https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=1000&q=90"
        },

        {
            id: 1805,
            restaurant: 18,
            name: "Cheese Burst Pizza",
            category: "Pizza",
            type: "veg",
            price: 289,
            rating: 4.7,
            time: "30 min",
            description: "Loaded cheese pizza with a rich cheese burst center and golden mozzarella topping.",
            image: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?auto=format&fit=crop&w=1000&q=90"
        },

        {
            id: 1806,
            restaurant: 18,
            name: "Spicy Chicken Pizza",
            category: "Pizza",
            type: "nonveg",
            price: 319,
            rating: 4.9,
            time: "30 min",
            description: "Spicy chicken pizza topped with jalapenos, onion, capsicum and extra cheese.",
            image: "https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1000&q=90"
        }

    ];

    let quantity = 1;

    const params = new URLSearchParams(
        window.location.search
    );

    const selectedFoodId = Number(
        params.get("food")
    );

    const selectedFoodStorage = JSON.parse(
        localStorage.getItem("foodtapSelectedFood") || "null"
    );

    const food =
        foods.find(function (item) {
            return item.id === selectedFoodId;
        }) ||
        selectedFoodStorage ||
        foods[0];

    document.getElementById("foodImage").src =
        food.image;

    document.getElementById("foodImage").alt =
        food.name;

    document.getElementById("foodCategory").textContent =
        food.category || "Food";

    document.getElementById("foodName").textContent =
        food.name;

    document.getElementById("foodDescription").textContent =
        food.description;

    document.getElementById("foodType").textContent =
        food.type === "nonveg"
            ? "Non-Veg"
            : "Veg";

    document.getElementById("foodRating").textContent =
        "★ " + food.rating;

    document.getElementById("foodTime").textContent =
        food.time;

    document.getElementById("foodPrice").textContent =
        "₹" + food.price;

    function changeQuantity(value) {

        quantity += value;

        if (quantity < 1) {
            quantity = 1;
        }

        document.getElementById("quantityValue").textContent =
            quantity;
    }

    function addToCart() {

        let cart = JSON.parse(
            localStorage.getItem("foodtapCart") || "[]"
        );

        const existingItem = cart.find(
            function (item) {
                return item.id === food.id;
            }
        );

        if (existingItem) {

            existingItem.quantity =
                (existingItem.quantity || 1) + quantity;

        } else {

            cart.push({
                id: food.id,
                restaurant: food.restaurant,
                name: food.name,
                category: food.category,
                type: food.type,
                price: food.price,
                rating: food.rating,
                time: food.time,
                description: food.description,
                image: food.image,
                quantity: quantity
            });

        }

        localStorage.setItem(
            "foodtapCart",
            JSON.stringify(cart)
        );

        updateCartCount();

        showToast(
            food.name + " added to cart"
        );

        quantity = 1;

        document.getElementById("quantityValue").textContent =
            "1";
    }

    function updateCartCount() {

        const cart = JSON.parse(
            localStorage.getItem("foodtapCart") || "[]"
        );

        const count = cart.reduce(
            function (total, item) {
                return total + (item.quantity || 1);
            },
            0
        );

        document.getElementById("cartCount").textContent =
            count;
    }

    function openCart() {

        window.location.href =
            "cart.html";
    }

    function goBack() {

        window.location.href =
            "foods.html?restaurant=" + food.restaurant;
    }

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent =
            message;

        toast.classList.add("show");

        setTimeout(
            function () {
                toast.classList.remove("show");
            },
            2500
        );
    }

    updateCartCount();

</script>
</body> </html>
