<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOODTAP - Checkout</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        color: #fff;
        background: #090909;
        overflow-x: hidden;
    }

    body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -3;

        background:
            radial-gradient(
                circle at 15% 15%,
                rgba(255, 112, 67, .16),
                transparent 28%
            ),
            radial-gradient(
                circle at 85% 25%,
                rgba(255, 87, 34, .11),
                transparent 30%
            ),
            radial-gradient(
                circle at 50% 90%,
                rgba(255, 112, 67, .08),
                transparent 32%
            ),
            #090909;
    }

    body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;

        background:
            linear-gradient(
                120deg,
                rgba(255, 255, 255, .015),
                transparent 30%,
                rgba(255, 112, 67, .018),
                transparent 70%
            );

        pointer-events: none;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 100;

        width: 100%;
        padding: 17px 5%;

        background: rgba(10, 10, 10, .84);
        backdrop-filter: blur(18px);

        border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .navbar {
        max-width: 1400px;
        margin: auto;

        display: flex;
        align-items: center;
        justify-content: space-between;

        gap: 25px;
    }

    .logo {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 1.5px;

        color: #ff7043;

        text-shadow:
            0 0 20px rgba(255, 112, 67, .22);
    }

    .logo span {
        color: #fff;
    }

    .cart-link {
        color: #ddd;
        font-size: 14px;
        cursor: pointer;
        transition: .3s;
    }

    .cart-link:hover {
        color: #ff7043;
    }

    .container {
        width: 90%;
        max-width: 1150px;
        margin: auto;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        margin-top: 30px;
        padding: 11px 17px;

        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 13px;

        background: rgba(255, 255, 255, .035);
        color: #ddd;

        cursor: pointer;
        transition: .3s;
    }

    .back-btn:hover {
        border-color: #ff7043;
        color: #ff7043;
    }

    .page-title {
        margin-top: 35px;
        margin-bottom: 30px;
    }

    .page-title h1 {
        font-size: clamp(34px, 5vw, 50px);
        margin-bottom: 8px;
    }

    .page-title p {
        color: #999;
        font-size: 14px;
    }

    .checkout-layout {
        display: grid;
        grid-template-columns: 1fr 350px;
        gap: 30px;

        margin-bottom: 70px;
    }

    .checkout-section {
        padding: 28px;

        background: rgba(255, 255, 255, .035);

        border: 1px solid rgba(255, 255, 255, .08);

        border-radius: 20px;
    }

    .checkout-section h2 {
        font-size: 22px;
        margin-bottom: 25px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #ccc;

        font-size: 13px;
        font-weight: 600;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;

        padding: 14px 15px;

        border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 12px;

        background: rgba(255, 255, 255, .045);

        color: #fff;

        outline: none;

        font-size: 14px;

        transition: .3s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #ff7043;

        box-shadow:
            0 0 0 3px rgba(255, 112, 67, .08);
    }

    .form-group textarea {
        min-height: 100px;
        resize: vertical;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: #666;
    }

    .summary {
        height: fit-content;

        padding: 25px;

        background: rgba(255, 255, 255, .035);

        border: 1px solid rgba(255, 255, 255, .08);

        border-radius: 20px;

        position: sticky;
        top: 105px;
    }

    .summary h2 {
        font-size: 22px;
        margin-bottom: 22px;
    }

    .summary-items {
        display: flex;
        flex-direction: column;
        gap: 12px;

        margin-bottom: 20px;
    }

    .summary-item {
        display: flex;
        justify-content: space-between;
        gap: 15px;

        color: #aaa;

        font-size: 13px;
    }

    .summary-item span:last-child {
        color: #ddd;
        white-space: nowrap;
    }

    .summary-divider {
        height: 1px;

        background: rgba(255, 255, 255, .08);

        margin: 15px 0 20px;
    }

    .summary-row {
        display: flex;
        justify-content: space-between;

        color: #aaa;

        font-size: 14px;

        margin-bottom: 16px;
    }

    .summary-row span:last-child {
        color: #ddd;
    }

    .summary-total {
        display: flex;
        justify-content: space-between;
        align-items: center;

        margin-top: 8px;
        margin-bottom: 22px;
    }

    .summary-total span:first-child {
        font-size: 16px;
        font-weight: 700;
    }

    .summary-total span:last-child {
        font-size: 25px;
        font-weight: 900;

        color: #ff7043;
    }

    .payment-note {
        margin-top: 18px;

        padding: 13px;

        border-radius: 12px;

        background: rgba(255, 112, 67, .07);

        border: 1px solid rgba(255, 112, 67, .18);

        color: #aaa;

        font-size: 12px;
        line-height: 1.5;
    }

    .continue-btn {
        width: 100%;

        padding: 15px 20px;

        border: none;
        border-radius: 14px;

        background: #ff7043;
        color: #111;

        font-size: 15px;
        font-weight: 900;

        cursor: pointer;

        transition: .3s;
    }

    .continue-btn:hover {
        background: #ff855f;

        transform: translateY(-2px);

        box-shadow:
            0 12px 30px rgba(255, 112, 67, .2);
    }

    .required {
        color: #ff7043;
    }

    footer {
        margin-top: 30px;
        padding: 35px 5%;

        border-top: 1px solid rgba(255, 255, 255, .07);

        text-align: center;

        color: #777;

        font-size: 13px;
    }

    footer strong {
        color: #ff7043;
    }

    .toast {
        position: fixed;

        left: 50%;
        bottom: 28px;

        transform: translate(-50%, 30px);

        background: #171717;

        border: 1px solid rgba(255, 112, 67, .35);

        color: #fff;

        padding: 14px 21px;

        border-radius: 13px;

        opacity: 0;
        pointer-events: none;

        transition: .35s;

        z-index: 500;

        box-shadow:
            0 15px 35px rgba(0, 0, 0, .4);
    }

    .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }

    @media (max-width: 850px) {

        .checkout-layout {
            grid-template-columns: 1fr;
        }

        .summary {
            position: static;
        }
    }

    @media (max-width: 600px) {

        header {
            padding: 14px 5%;
        }

        .logo {
            font-size: 23px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .form-group.full {
            grid-column: auto;
        }

        .checkout-section {
            padding: 22px;
        }
    }

</style>
</head> <body>
<header>

    <div class="navbar">

        <div class="logo">
            FOOD<span>TAP</span>
        </div>

        <div
            class="cart-link"
            onclick="goToCart()"
        >
            Cart
        </div>

    </div>

</header>


<main class="container">

    <button
        class="back-btn"
        onclick="goToCart()"
    >
        ← Back to Cart
    </button>


    <div class="page-title">

        <h1>
            Checkout
        </h1>

        <p>
            Enter your delivery details to continue.
        </p>

    </div>


    <div class="checkout-layout">


        <section class="checkout-section">

            <h2>
                Delivery Details
            </h2>


            <form id="checkoutForm">

                <div class="form-row">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                            <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label for="address">
                            Delivery Address
                            <span class="required">*</span>
                        </label>

                        <textarea
                            id="address"
                            placeholder="Enter your complete delivery address"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="city">
                            City
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="pincode">
                            Pincode
                            <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Enter pincode"
                            maxlength="6"
                            required
                        >

                    </div>

                </div>

            </form>

        </section>


        <aside class="summary">

            <h2>
                Order Summary
            </h2>


            <div
                class="summary-items"
                id="summaryItems"
            >
            </div>


            <div class="summary-divider"></div>


            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    ₹0
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Delivery Fee
                </span>

                <span id="deliveryFee">
                    ₹40
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Taxes & Charges
                </span>

                <span id="taxes">
                    ₹20
                </span>

            </div>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <span id="total">
                    ₹60
                </span>

            </div>


            <button
                class="continue-btn"
                onclick="continueToPayment()"
            >
                Continue to Payment
            </button>


            <div class="payment-note">

                Payment options will be available on
                the next step.

            </div>

        </aside>

    </div>

</main>


<footer>

    <strong>FOODTAP</strong>
    |
    Delicious food, delivered with care.

</footer>


<div
    class="toast"
    id="toast"
></div>


<script>

    const currentUser = JSON.parse(
        localStorage.getItem("foodtapCurrentUser") || "null"
    );


    if (!currentUser) {

        window.location.href = "login.html";

    }


    const cart = JSON.parse(
        localStorage.getItem("foodtapCart") || "[]"
    );


    const orderSummary = JSON.parse(
        localStorage.getItem("foodtapOrderSummary") || "null"
    );


    const DELIVERY_FEE = 40;
    const TAXES = 20;


    if (cart.length === 0) {

        window.location.href = "restaurants.html";

    }


    function loadUserDetails() {

        if (!currentUser) {
            return;
        }


        document.getElementById("name").value =
            currentUser.name || "";


        document.getElementById("phone").value =
            currentUser.phone || "";


        document.getElementById("address").value =
            currentUser.address || "";

    }


    function loadOrderSummary() {

        const summaryItems =
            document.getElementById("summaryItems");


        summaryItems.innerHTML = "";


        let subtotal = 0;


        cart.forEach(
            function (item) {

                const quantity =
                    item.quantity || 1;


                const itemTotal =
                    item.price * quantity;


                subtotal += itemTotal;


                const summaryItem =
                    document.createElement("div");


                summaryItem.className =
                    "summary-item";


                summaryItem.innerHTML = `

                    <span>
                        ${item.name} × ${quantity}
                    </span>

                    <span>
                        ₹${itemTotal}
                    </span>

                `;


                summaryItems.appendChild(
                    summaryItem
                );

            }
        );


        const deliveryFee =
            orderSummary &&
            orderSummary.deliveryFee !== undefined
                ? orderSummary.deliveryFee
                : DELIVERY_FEE;


        const taxes =
            orderSummary &&
            orderSummary.taxes !== undefined
                ? orderSummary.taxes
                : TAXES;


        const total =
            subtotal +
            deliveryFee +
            taxes;


        document.getElementById(
            "subtotal"
        ).textContent =
            "₹" + subtotal;


        document.getElementById(
            "deliveryFee"
        ).textContent =
            "₹" + deliveryFee;


        document.getElementById(
            "taxes"
        ).textContent =
            "₹" + taxes;


        document.getElementById(
            "total"
        ).textContent =
            "₹" + total;


        localStorage.setItem(
            "foodtapOrderSummary",
            JSON.stringify({
                subtotal: subtotal,
                deliveryFee: deliveryFee,
                taxes: taxes,
                total: total
            })
        );

    }


    function continueToPayment() {

        const form =
            document.getElementById(
                "checkoutForm"
            );


        if (!form.checkValidity()) {

            form.reportValidity();

            return;

        }


        const phone =
            document.getElementById(
                "phone"
            ).value.trim();


        const pincode =
            document.getElementById(
                "pincode"
            ).value.trim();


        if (!/^[0-9]{10}$/.test(phone)) {

            showToast(
                "Enter a valid 10-digit phone number"
            );

            return;

        }


        if (!/^[0-9]{6}$/.test(pincode)) {

            showToast(
                "Enter a valid 6-digit pincode"
            );

            return;

        }


        const deliveryDetails = {

            name:
                document.getElementById(
                    "name"
                ).value.trim(),

            phone:
                phone,

            address:
                document.getElementById(
                    "address"
                ).value.trim(),

            city:
                document.getElementById(
                    "city"
                ).value.trim(),

            pincode:
                pincode

        };


        localStorage.setItem(
            "foodtapDeliveryDetails",
            JSON.stringify(
                deliveryDetails
            )
        );


        window.location.href =
            "payment.html";

    }


    function goToCart() {

        window.location.href =
            "cart.html";

    }


    function showToast(message) {

        const toast =
            document.getElementById(
                "toast"
            );


        toast.textContent =
            message;


        toast.classList.add(
            "show"
        );


        setTimeout(
            function () {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

    }


    loadUserDetails();

    loadOrderSummary();

</script>
</body> </html>
