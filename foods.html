; list.forEach( (food,index)=>{ const quantity = getQuantity(food.id); const card = document.createElement( "div" ); card.className= "food-card"; card.style.animationDelay= (index*0.05)+"s"; const typeDot = food.type==="veg" ? '<span class="veg-dot"></span>Veg' : '<span class="nonveg-dot"></span>Non-Veg'; let actionHTML=""; if(quantity>0){ actionHTML=` <div class="quantity-control" > <button onclick="decreaseQuantity(${food.id})"> - </button> <span> ${quantity} </span> <button onclick="addToCart(${food.id})"> + </button> </div> `; }else{ actionHTML=` <button class="add-btn" onclick="addToCart(${food.id})"> Add to Cart </button> `; } card.innerHTML=` <div class="food-image-wrap"> <img class="food-image" src="${food.image}" alt="${food.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1547592166-23ac45744acd?auto=format&fit=crop&w=1000&q=80';"> <div class="food-badge"> ${typeDot} </div> </div> <div class="food-content"> <div class="food-top"> <div class="food-name"> ${food.name} </div> <div class="food-price"> Rs. ${food.price} </div> </div> <div class="food-description"> ${food.description} </div> <div class="food-info"> <span class="rating"> ${food.rating} </span> <span> ${food.time} </span> <span> ${food.category} </span> </div> <div class="food-actions"> <button class="details-btn" onclick="openFoodDetails(${food.id})"> View Details </button> ${actionHTML} </div> </div> `; grid.appendChild(card); } ); } document .querySelectorAll(".category") .forEach( button=>{ button.addEventListener( "click", ()=>{ document .querySelectorAll(".category") .forEach( btn => btn.classList .remove("active") ); button.classList .add("active"); selectedCategory = button.dataset.category; renderFoods(); } ); } ); document .getElementById("foodSearch") .addEventListener( "input", function(){ searchText=this.value; renderFoods(); } ); function goHome(){ window.location.href= "restaurants.html"; } function openCart(){ if(cart.length===0){ showToast( "Your cart is
