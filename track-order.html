<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>FOODTAP - Track Order</title> <style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; } body { min-height: 100vh; color: #fff; background: #090909; overflow-x: hidden; } body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 15% 15%, rgba(255,112,67,.16), transparent 28%), radial-gradient(circle at 85% 25%, rgba(255,87,34,.11), transparent 30%), radial-gradient(circle at 50% 90%, rgba(255,112,67,.08), transparent 32%), #090909; z-index: -2; } body::after { content: ""; position: fixed; inset: 0; background: linear-gradient(120deg, rgba(255,255,255,.015), transparent 30%, rgba(255,112,67,.018), transparent 70%); z-index: -1; pointer-events: none; } .navbar { width: 100%; padding: 22px 7%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(9,9,9,.72); backdrop-filter: blur(12px); } .logo { font-size: 28px; font-weight: 800; color: #ff7043; letter-spacing: 1px; } .nav-buttons { display: flex; gap: 12px; } .nav-btn { padding: 10px 18px; border: 1px solid rgba(255,112,67,.4); border-radius: 10px; background: transparent; color: #fff; cursor: pointer; font-size: 14px; } .nav-btn:hover { background: #ff7043; border-color: #ff7043; } .container { width: 90%; max-width: 900px; margin: 45px auto; } .page-header { margin-bottom: 28px; } .page-header h1 { font-size: 34px; margin-bottom: 8px; } .page-header p { color: #aaa; font-size: 15px; } .tracking-card { background: rgba(20,20,20,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 30px; box-shadow: 0 15px 40px rgba(0,0,0,.3); } .order-header { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.08); } .order-id { font-size: 20px; font-weight: 700; } .order-date { color: #888; font-size: 13px; margin-top: 6px; } .status { padding: 9px 16px; border-radius: 20px; background: rgba(255,112,67,.14); border: 1px solid rgba(255,112,67,.35); color: #ff8a65; font-size: 13px; font-weight: 700; } .progress-section { padding: 35px 10px; } .progress-line { position: relative; height: 5px; background: #292929; border-radius: 10px; margin: 20px 8% 45px; } .progress-fill { position: absolute; left: 0; top: 0; height: 5px; width: 17%; background: #ff7043; border-radius: 10px; } .steps { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-top: -68px; } .step { text-align: center; position: relative; } .step-circle { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #202020; border: 2px solid #444; color: #888; font-weight: 700; position: relative; z-index: 2; } .step.active .step-circle, .step.completed .step-circle { background: #ff7043; border-color: #ff7043; color: #fff; } .step-title { font-size: 13px; font-weight: 700; } .step-text { color: #777; font-size: 11px; margin-top: 5px; } .details { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 10px; } .detail-box { padding: 18px; background: rgba(255,255,255,.035); border-radius: 13px; } .detail-label { color: #888; font-size: 12px; margin-bottom: 7px; } .detail-value { color: #fff; font-size: 15px; font-weight: 600; line-height: 1.5; } .items { margin-top: 22px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.08); } .items h3 { font-size: 17px; margin-bottom: 14px; } .item { display: flex; justify-content: space-between; padding: 9px 0; color: #ddd; font-size: 14px; } .item-price { font-weight: 600; } .bottom-actions { display: flex; gap: 12px; margin-top: 28px; } .action-btn { flex: 1; padding: 13px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 700; } .orders-btn { background: #ff7043; border: 1px solid #ff7043; color: #fff; } .restaurants-btn { background: transparent; border: 1px solid rgba(255,112,67,.45); color: #fff; } .empty-state { text-align: center; padding: 70px 20px; background: rgba(20,20,20,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; } .empty-state h2 { margin-bottom: 10px; } .empty-state p { color: #999; margin-bottom: 25px; } @media (max-width:700px) { .navbar { padding: 18px 5%; } .logo { font-size: 23px; } .container { width: 92%; margin: 30px auto; } .page-header h1 { font-size: 28px; } .tracking-card { padding: 20px; } .order-header { flex-direction: column; align-items: flex-start; } .details { grid-template-columns: 1fr; } .steps { grid-template-columns: repeat(2,1fr); gap: 25px; margin-top: 0; } .progress-line { display: none; } .bottom-actions { flex-direction: column; } } </style> </head> <body> <nav class="navbar">
<div class="logo">
    FOODTAP
</div>

<div class="nav-buttons">

    <button
        class="nav-btn"
        onclick="goOrders()"
    >
        My Orders
    </button>

    <button
        class="nav-btn"
        onclick="logout()"
    >
        Logout
    </button>

</div>
</nav> <main class="container">
<div class="page-header">

    <h1>
        Track Your Order
    </h1>

    <p>
        Follow your FOODTAP order from confirmation to delivery.
    </p>

</div>

<div id="trackingContainer"></div>
</main> <script> const currentUser = JSON.parse( localStorage.getItem("foodtapCurrentUser") || "null" ); if (!currentUser) { window.location.href = "login.html"; } function formatDate(dateString) { if (!dateString) { return "Date unavailable"; } const date = new Date(dateString); if (isNaN(date.getTime())) { return "Date unavailable"; } return date.toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); } function getPaymentName(payment) { if (payment === "COD") { return "Cash on Delivery"; } if (payment === "UPI") { return "UPI"; } if (payment === "CARD") { return "Debit/Credit Card"; } return payment || "Not available"; } function loadTracking() { /* * FIX: * First read the complete current order. */ const currentOrder = JSON.parse( localStorage.getItem("foodtapCurrentOrder") || "null" ); const trackingOrderId = localStorage.getItem( "foodtapTrackingOrderId" ); let order = currentOrder; /* * If a tracking ID exists, try to find that * exact order from foodtapOrders. */ if (trackingOrderId) { const orders = JSON.parse( localStorage.getItem("foodtapOrders") || "[]" ); const foundOrder = orders.find( function(item) { return item.orderId === trackingOrderId; } ); if (foundOrder) { order = foundOrder; } } const container = document.getElementById( "trackingContainer" ); if (!order) { container.innerHTML = ` <div class="empty-state"> <h2> Order Not Found </h2> <p> We could not find the order you are trying to track. </p> <button class="action-btn orders-btn" onclick="goOrders()" > View My Orders </button> </div> `; return; } const items = Array.isArray(order.items) ? order.items : []; const itemsHTML = items.length > 0 ? items.map( function(item) { return ` <div class="item"> <span> ${item.name} × ${item.quantity || 1} </span> <span class="item-price"> ₹${( Number(item.price || 0) * Number(item.quantity || 1) ).toFixed(2)} </span> </div> `; } ).join("") : ` <div class="item"> <span> Order items unavailable </span> </div> `; container.innerHTML = ` <div class="tracking-card"> <div class="order-header"> <div> <div class="order-id"> Order #${order.orderId} </div> <div class="order-date"> ${formatDate(order.orderDate)} </div> </div> <div class="status"> ${order.status || "PLACED"} </div> </div> <div class="progress-section"> <div class="progress-line"> <div class="progress-fill"></div> </div> <div class="steps"> <div class="step active"> <div class="step-circle"> 1 </div> <div class="step-title"> Order Placed </div> <div class="step-text"> Confirmed </div> </div> <div class="step"> <div class="step-circle"> 2 </div> <div class="step-title"> Preparing </div> <div class="step-text"> Restaurant is preparing </div> </div> <div class="step"> <div class="step-circle"> 3 </div> <div class="step-title"> On the Way </div> <div class="step-text"> Out for delivery </div> </div> <div class="step"> <div class="step-circle"> 4 </div> <div class="step-title"> Delivered </div> <div class="step-text"> Order completed </div> </div> </div> </div> <div class="details"> <div class="detail-box"> <div class="detail-label"> Customer </div> <div class="detail-value"> ${order.customerName || currentUser.name || "Customer"} </div> </div> <div class="detail-box"> <div class="detail-label"> Payment </div> <div class="detail-value"> ${getPaymentName(order.paymentOption)} </div> </div> <div class="detail-box"> <div class="detail-label"> Delivery Address </div> <div class="detail-value"> ${ order.deliveryDetails && order.deliveryDetails.address ? order.deliveryDetails.address : "Address unavailable" } </div> </div> <div class="detail-box"> <div class="detail-label"> Total Amount </div> <div class="detail-value"> ₹${Number(order.total || 0).toFixed(2)} </div> </div> </div> <div class="items"> <h3> Order Items </h3> ${itemsHTML} </div> <div class="bottom-actions"> <button class="action-btn orders-btn" onclick="goOrders()" > Back to Orders </button> <button class="action-btn restaurants-btn" onclick="goRestaurants()" > Order Again </button> </div> </div> `; } function goOrders() { window.location.href = "orders.html"; } function goRestaurants() { window.location.href = "restaurants.html"; } function logout() { localStorage.removeItem( "foodtapCurrentUser" ); localStorage.removeItem( "foodtapSelectedRestaurant" ); localStorage.removeItem( "foodtapSelectedFood" ); window.location.href = "login.html"; } loadTracking(); </script> </body> </html>
